name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pabnapolice_laravel_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: pabnapolice_laravel_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - name: Build admin assets (Vite)
        run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: ./vendor/bin/pint --test
      - name: Static analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Tests (includes a from-scratch migration of an empty database)
        run: php artisan test
